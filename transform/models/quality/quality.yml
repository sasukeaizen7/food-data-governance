version: 2

models:
  - name: dq_results
    description: >
      Outcome of every quality rule on every product it applies to (status pass / fail).
      A rule applies only when the data it needs exists. `observed` holds the values behind a failure.
    meta:
      owner: data_engineering
    columns:
      - name: rule_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dq_rules')
                field: rule_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pass', 'fail']
    data_tests:
      - unique_combination:
          arguments:
            columns: ['code', 'rule_id']
